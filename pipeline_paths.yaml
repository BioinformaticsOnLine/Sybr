# ─────────────────────────────────────────────────────────────────────────────
#  pipeline_paths.yaml  —  Static paths & permanent tool parameters
#  You should rarely need to edit this file.
#  All paths are relative to the workflow base directory unless absolute.
# ─────────────────────────────────────────────────────────────────────────────

# ── Shared script directory ──────────────────────────────────────────────────
scripts: "script_base"

# ── Synteny processing ───────────────────────────────────────────────────────
satsuma_alignments:       "inputs/Satsuma_alignments"
sequence_lengths_file:    "inputs/all_sequence_lengths.txt"
synteny_results:          "outputs/synteny_results"

# ── Output folder name for pre-EBA synteny ──
out_final: "pre-EBA1"

# ── EBA analysis — paths ─────────────────────────────────────────────────────
eba_format:
  pre_EBA_dir:        "outputs/pre-EBA"
  scaffolds_file:     "inputs/Scaffolds.txt"   # use ALL_CHROMOSOMES to include everything
  eba_input_dir:      "inputs/EBA/EBA-input"
  mshsbs_dir:         "outputs/msHSBs"
  ebrs_dir:           "outputs/EBRs"
  copy_destination_dir: "outputs/EBA_results"
  chr_size_file:      "inputs/EBA/chr_size.txt"

# ── EBA tool paths ────────────────────────────────────────────────────────────
eba_tools:
  eba_script_path: "tools/EBA3.0/EBA.pl"

# ── EBA static parameters (paths + fixed run params) ─────────────────────
eba:
  d: "inputs/EBA/EBA-input"
  t: 20
  c: "inputs/EBA/classification.eba"
  k: true
  # n, r, p come from run_sybr_config.yaml and are deep-merged by config_handling.smk

# ── Enrichment analysis — paths ───────────────────────────────────────────────
enrichment:
  annotation_file: "inputs/getENRICH_input/protein_annotation.tsv"
  kegg_file:       "inputs/getENRICH_input/3kegg_annotationTOgenes.txt"
  msHSBs_dir:      "outputs/msHSBs"

# ── Alignment processing / chainNet ──────────────────────────────────────────
chainNet:
  seq_dir:           "inputs/seq"
  lastZ_alignments:  "inputs/LastZ_alignments"
  output_dir:        "outputs/DESCHRAMBLER_results"

# ── DESCHRAMBLER ─────────────────────────────────────────────────────────────
deschrambler:
  pipeline_tool_dir: "tools/DESCHRAMBLER"
  tree_file:         "inputs/tree.txt"
  species_file:      "inputs/species_info.txt"
