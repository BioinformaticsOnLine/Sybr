name: sybr
channels:
  - jitendralab        # add this
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python and Snakemake - pinned versions
  - python=3.11
  - snakemake=9.12.0

  # UCSC tools
  - ucsc-fatotwobit
  - ucsc-axtchain
  - ucsc-chainsplit
  - ucsc-fasize
  - ucsc-chainprenet
  - ucsc-chainnet
  - ucsc-netsyntenic

  # R base - pinned to stable version
  - r-base=4.4.*

  # CRAN R packages (via conda-forge)
  - r-jsonlite
  - r-dplyr
  - r-tidyverse
  - r-ggplot2
  - r-ontologyindex
  - r-plotly
  - r-upsetr
  - r-visnetwork
  - r-circlize

  # CRAN R packages (via bioconda)
  - r-pheatmap

  # Bioconductor packages (via bioconda)
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-complexheatmap
  - bioconductor-pathview

  # Perl and modules
  - perl
  - perl-math-round
  - perl-list-compare
  - perl-bioperl

  # R package from jitendralab
  - jitendralab::r-syntenyplotter>=1.0.2
  - jitendralab::syntenytracker2>=2.0.1
  # Build tools
  - make
